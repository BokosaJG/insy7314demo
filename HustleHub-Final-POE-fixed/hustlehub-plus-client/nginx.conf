# nginx configuration for the HustleHub+ client container.

# Resolve the API container at request time through Docker's DNS, so nginx
# still starts if the API container is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20k;   # the API accepts at most 10 kB of JSON

  # Container health probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # API: forwarded to the API container over HTTPS. The API's certificate is
  # self-signed, so verification is off for this INTERNAL hop only (traffic
  # never leaves the Docker network). In production use a certificate issued
  # by a CA the proxy trusts and set proxy_ssl_verify on.
  # The API sets its own security headers; none are added here.
  location /api/ {
    set $api_upstream https://api:4000;
    proxy_pass $api_upstream;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;

    # Security headers for the web app (the API sets its own, stricter ones).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  # Hashed build assets can be cached for a long time. add_header here replaces
  # the location-level set above, so the security headers are repeated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
