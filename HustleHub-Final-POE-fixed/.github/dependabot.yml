# Automatic weekly pull requests for vulnerable / outdated dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /hustlehub-plus-api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /hustlehub-plus-client
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /hustlehub-plus-api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /hustlehub-plus-client
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
